type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
properties:
  _id:
    description: "Unique identifier of the contact"
    type: string
    example: "64e4decdd286b30065d54af9"
  name:
    description: "Contact's name"
    type: string
    example: "John Doe"
  phoneNumber:
    description: "Contact's phone number, including country code if applicable"
    type: string
    example: "+1-800-123-456"
  email:
    description: "Contact's email address"
    type: string
    format: email
    example: "john.doe@example.com"
  isFavourite:
    description: "Whether the contact is in favourites"
    type: boolean
    example: true
  contactType:
    description: "Type of contact"
    type: string
    enum: ["work", "home", "personal"]
    example: "work"
  photo:
    description: "Link to contact's photo"
    type: string
    example: "https://example.com/images/contact-photo.jpg"
  userId:
    description: "Unique identifier of the user who owns the contact"
    type: string
    example: "64e4decdd286b30065d54b00"
