type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "Unique identifier of the user"
    type: string
    example: "64e4decdd286b30065d54b00"
  name:
    description: "User's name"
    type: string
    example: "John Doe"
  email:
    description: "User's email address"
    type: string
    format: email
    example: "john@example.com"
  password:
    description: "User's password"
    type: string
    format: password
    example: "Str0ngP@ssw0rd!"
