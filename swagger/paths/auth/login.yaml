tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authenticate user with email and password'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'john@example.com'
          password:
            description: "User's password"
            type: string
            example: 'Str0ngP@ssW0rd123'
responses:
  '200':
    description: 'User successfully logged in'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'YozIndk/O+AoYhDfl+qyNuo7yq65uMriQ5m5o8ec'
  '401':
    $ref: '../../components/responses/401InvalidCredentials.yaml'
