tags:
  - Auth
summary: Refresh user session
operationId: refreshSession
description: 'Refresh user session.'
security: []
responses:
  '200':
    description: 'Successfully refreshed the session.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Session refreshed successfully!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'YozIndk/O+AoYhDfl+qyNuo7yq65uMriQ5m5o8ec'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
