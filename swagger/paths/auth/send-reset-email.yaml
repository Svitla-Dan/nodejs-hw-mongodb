tags:
  - Auth
summary: Send reset password email
operationId: sendResetPasswordEmail
description: 'Send an email to reset the user password'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email address to send the reset link"
            type: string
            format: email
            example: 'john@example.com'
responses:
  '200':
    description: 'Reset password email sent successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email was successfully sent!'
            data:
              type: object
              properties: {}
  '400':
    $ref: '../../components/responses/400.yaml'
  '404':
    $ref: '../../components/responses/404UserNotFound.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
